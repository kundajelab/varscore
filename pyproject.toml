[project]
name = "varscore"
description = "A library for common functions in variant effect prediction & prioritization."
authors = [
	{ name = "Ivy Evergreen" },
	{ name = "Salil Deshpande" },
	{ name = "Riya Sinha" },
]
version = "0.0.2a0"
requires-python = ">= 3.9, < 3.13"

# Core dependencies: the lightweight annotation / region / lookup / prioritization
# library. Deliberately TensorFlow-free so it installs on macOS arm64 and modern
# Python where the old TF wheels don't exist. Heavy / platform-constrained deps
# live in the optional extras below.
dependencies = [
	"duckdb>=1.0.0",
	"intervaltree>=3.1.0",
	"ncls>=0.0.70",
	"numpy>=1.23",
	"pandas>=1.3.4",
	"pyarrow>=17.0.0",
	"pydantic>=2.0",
	"pyfaidx>=0.6.1",
	"pysam>=0.22.1",
	"scipy>=1.10",
]
keywords = ["variant scoring", "variant effect", "variant prioritization", "variant", "scoring", "effect", "prioritization", "genomics", "chrombpnet"]

[project.urls]
Repository = "https://github.com/kundajelab/varscore.git"
Issues = "https://github.com/kundajelab/varscore/issues"

[project.optional-dependencies]
# ChromBPNet model scoring + SHAP interpretation. Pins the legacy TensorFlow
# stack, which constrains this extra to Python < 3.10 / Linux. Install only where
# you actually run the model: `pip install varscore[model]`.
model = [
	"tensorflow==2.8.1",
	"tensorflow-probability==0.14.0",
	"deeplift==0.6.13.0",
	"kundajelab-shap==1",
	"numpy<1.24",
	"scipy==1.10.1",
	"matplotlib>=3.5",
]
# Conservation-score lookups (CADD, PhyloP).
conservation = [
	"pysam>=0.22.1",
	"pybigwig>=0.3.22",
]

[build-system]
requires = ["setuptools >= 61.0"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["varscore*"]
exclude = ["tests*"]

[tool.setuptools.package-data]
varscore = ["data/gene_df.tsv"]

# Dev tooling (uv-native; installed in CI via `uv sync --dev`).
[dependency-groups]
dev = [
	"pytest>=8.3.4",
	"build>=1.2",
]
