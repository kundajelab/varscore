[project]
name = "varscore-runtime-chrombpnet"
version = "0.0.0"
requires-python = ">=3.9,<3.10"
dependencies = [
    "varscore",
    "tensorflow==2.8.1",
    "tensorflow-probability==0.14.0",
    "deeplift==0.6.13.0",
    "kundajelab-shap==1",
    "numpy>=1.23,<1.24",
    "scipy==1.10.1",
    "matplotlib>=3.5",
